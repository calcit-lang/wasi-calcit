on:
  push:
    branches:
      - main
  pull_request: {}

name: Test

permissions:
  contents: read

jobs:
  build_and_test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Validate Rust host
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Smoke test Calcit modes
        run: |
          cargo run -- --once examples/calcit.cirru
          cargo run -- --once -e '+ 1 2'
          cargo run -- --once --emit-js --emit-path /tmp/wasi-calcit-js examples/calcit.cirru

      - name: Build WASI Preview 1 binary
        run: cargo build --target wasm32-wasip1
